# Small VPS deployment: one bot process (bot + worker) and PostgreSQL.
#   cp .env.example .env   # fill in secrets
#   docker compose up -d --build
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: gamebot
      POSTGRES_USER: gamebot
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backups:/backups
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gamebot -d gamebot"]
      interval: 5s
      timeout: 5s
      retries: 20

  bot:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgres://gamebot:${POSTGRES_PASSWORD}@db:5432/gamebot
    depends_on:
      db:
        condition: service_healthy
    ports:
      # Webhook + /healthz + /metrics. Publish only on localhost; put Caddy/nginx (TLS) in front.
      - "127.0.0.1:8080:8080"
    volumes:
      - botdata:/app/.data
    stop_grace_period: 30s

volumes:
  pgdata:
  botdata:
